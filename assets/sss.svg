<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">SSS</title>
  <desc id="description">An ephemeral store-and-forward artifact relay: send files, get a short code, receive them anywhere.</desc>

  <defs>
    <linearGradient id="s-mark" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="330" y2="196">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset=".55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="s-wire" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ffd08a" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset=".8" stop-color="#a5b4fc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="s-sky" cx=".24" cy="0" r=".9">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#ffd08a" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".15"/>
      <stop offset=".6" stop-color="#a5b4fc" stop-opacity=".04"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s-grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#e8f2ff" fill-opacity=".045"/>
    </pattern>
    <clipPath id="s-card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#s-card)">
    <rect width="1200" height="320" fill="#05080b"/>
    <rect width="1200" height="320" fill="url(#s-sky)"/>
    <rect width="1200" height="320" fill="url(#s-grain)"/>
    <ellipse cx="700" cy="150" rx="340" ry="190" fill="url(#s-bloom)"/>

    <!-- wordmark -->
    <text x="88" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="132" font-weight="700" letter-spacing="6" fill="url(#s-mark)">sss</text>
    <text x="92" y="222" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="21" letter-spacing="1.5" fill="#8fa3b8">ephemeral store-and-forward artifact relay</text>
    <text x="92" y="252" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="17" letter-spacing=".3" fill="#5d7286">send anything, hand over eight characters, receive it anywhere</text>

    <!-- relay: device -> vps -> device -->
    <g transform="translate(560 96)">
      <path d="M64 64 H168" stroke="#3a5468" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>
      <path d="M312 64 H416" stroke="#3a5468" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>

      <!-- sender -->
      <rect x="0" y="34" width="56" height="60" rx="9" fill="#0b131a" stroke="#22303d" stroke-width="1.5"/>
      <rect x="12" y="48" width="32" height="4" rx="2" fill="#3f5568"/>
      <rect x="12" y="60" width="32" height="4" rx="2" fill="#2f4354"/>
      <rect x="12" y="72" width="20" height="4" rx="2" fill="#2f4354"/>

      <!-- vps holding the handoff -->
      <rect x="176" y="14" width="128" height="100" rx="12" fill="#0a1218" stroke="#27384a" stroke-width="1.5"/>
      <rect x="186" y="34" width="108" height="28" rx="7" fill="#0f1a23" stroke="#2c4256" stroke-width="1"/>
      <text x="240" y="53" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.2" fill="#cfe6f7">K7M4-Q2PX</text>
      <rect x="186" y="74" width="108" height="6" rx="3" fill="#16242f"/>
      <rect x="186" y="74" width="62" height="6" rx="3" fill="url(#s-ttl)"/>
      <text x="240" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
            font-size="11" letter-spacing=".8" fill="#5d7286">expires in 30m</text>

      <!-- receiver -->
      <rect x="424" y="34" width="56" height="60" rx="9" fill="#0b131a" stroke="#22303d" stroke-width="1.5"/>
      <path d="M438 64 l8 8 l16 -18" fill="none" stroke="#9bffcd" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="0" y="317" width="1200" height="3" fill="url(#s-wire)"/>
  </g>
</svg>
