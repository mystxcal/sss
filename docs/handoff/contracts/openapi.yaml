openapi: 3.1.0
info:
  title: SSS Artifact Relay API
  version: 1.0.0
  summary: Ephemeral authenticated store-and-forward artifact relay
servers:
  - url: https://drop.example.com
security:
  - basicAuth: []

paths:
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        "200":
          description: Alive
          content:
            text/plain:
              schema:
                type: string

  /readyz:
    get:
      security: []
      summary: Readiness after startup reconciliation
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /v1/info:
    get:
      summary: Server capabilities and limits
      responses:
        "200":
          description: Capability information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /s:
    post:
      summary: Simple multipart handoff upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                note:
                  type: string
                  maxLength: 16384
                ttl:
                  type: integer
                  minimum: 1
                  maximum: 3000
      responses:
        "201":
          description: Committed code
          headers:
            Location:
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Code"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /s/raw:
    post:
      summary: Simple raw stream handoff upload
      parameters:
        - name: X-SSS-Filename
          in: header
          required: true
          schema:
            type: string
        - name: X-SSS-Note
          in: header
          required: false
          schema:
            type: string
            maxLength: 16384
        - name: X-SSS-TTL
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3000
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Committed code
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Code"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /r/{code}:
    get:
      summary: Simple handoff download
      parameters:
        - $ref: "#/components/parameters/CodePath"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [auto, raw, zip, tar]
            default: auto
      responses:
        "200":
          description: Raw file or streaming archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            application/x-tar:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Expired"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /v1/transfers/{code}:
    get:
      summary: Inspect a committed transfer
      parameters:
        - $ref: "#/components/parameters/CodePath"
      responses:
        "200":
          description: Transfer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Expired"

  /v1/transfers:
    post:
      summary: Create an advanced resumable transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer and upload resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTransferResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /v1/uploads/{upload_id}:
    head:
      summary: Retrieve accepted resumable upload offset
      parameters:
        - $ref: "#/components/parameters/UploadIdPath"
      responses:
        "200":
          description: Current offset
          headers:
            Upload-Offset:
              required: true
              schema:
                type: integer
                minimum: 0
            Upload-Length:
              required: true
              schema:
                type: integer
                minimum: 0
            Tus-Resumable:
              required: true
              schema:
                type: string
                const: 1.0.0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Append bytes to resumable upload
      parameters:
        - $ref: "#/components/parameters/UploadIdPath"
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: Tus-Resumable
          in: header
          required: true
          schema:
            type: string
            const: 1.0.0
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Bytes accepted
          headers:
            Upload-Offset:
              required: true
              schema:
                type: integer
                minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /v1/transfers/{transfer_id}/commit:
    post:
      summary: Verify, materialize, publish, and allocate code
      parameters:
        - $ref: "#/components/parameters/TransferIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Existing idempotent commit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "201":
          description: Newly committed transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /v1/claims:
    post:
      summary: Create a bounded receive claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  $ref: "#/components/schemas/Code"
      responses:
        "201":
          description: Claim session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Expired"

  /v1/claims/{claim_id}/segments/{segment_id}:
    get:
      security:
        - claimBearer: []
      summary: Download immutable segment with range support
      parameters:
        - name: claim_id
          in: path
          required: true
          schema:
            type: string
        - name: segment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete segment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Segment range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Expired"

  /v1/claims/{claim_id}/complete:
    post:
      security:
        - claimBearer: []
      summary: Mark receive claim complete
      parameters:
        - name: claim_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Completion recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /local/r/{code}:
    get:
      security: []
      summary: Return an existing VPS-local payload path
      description: Unix-socket listener only. Must not be exposed by the public listener.
      parameters:
        - $ref: "#/components/parameters/CodePath"
      responses:
        "200":
          description: Plain path or JSON local claim
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LocalClaim"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Expired"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    claimBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    CodePath:
      name: code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Code"
    TransferIdPath:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    UploadIdPath:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 200

  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string
    NotFound:
      description: Transfer or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string
    Expired:
      description: Transfer or claim expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string
    Conflict:
      description: State, offset, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooLarge:
      description: Size or file-count limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string
    Unprocessable:
      description: Semantically invalid transfer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string
    InsufficientStorage:
      description: Disk admission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
        text/plain:
          schema:
            type: string

  schemas:
    Code:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{4}-?[0-9A-HJKMNP-TV-Z]{4}$"
      examples: ["K7M4-Q2PX"]

    Info:
      type: object
      required:
        - application_version
        - protocol_version
        - default_ttl_minutes
        - max_ttl_minutes
        - capabilities
      properties:
        application_version:
          type: string
        protocol_version:
          type: string
        default_ttl_minutes:
          type: integer
        max_ttl_minutes:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true

    SegmentPlan:
      type: object
      required: [id, kind, expected_length, digest_algorithm]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [raw, tar_zstd]
        expected_length:
          type: integer
          minimum: 0
        digest_algorithm:
          type: string
          enum: [blake3]
        expected_digest:
          type: [string, "null"]

    CreateTransferRequest:
      type: object
      required: [ttl_minutes, segments]
      properties:
        client_transfer_id:
          type: string
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 3000
        note:
          type: string
          maxLength: 16384
        expected_materialized_bytes:
          type: integer
          minimum: 0
        expected_file_count:
          type: integer
          minimum: 1
        segments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SegmentPlan"

    UploadResource:
      type: object
      required: [segment_id, upload_id, upload_path]
      properties:
        segment_id:
          type: string
        upload_id:
          type: string
        upload_path:
          type: string

    CreateTransferResponse:
      type: object
      required: [transfer_id, uploads]
      properties:
        transfer_id:
          type: string
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadResource"

    CommitRequest:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: object
          additionalProperties: true

    CommitResponse:
      type: object
      required: [code, committed_at, expires_at]
      properties:
        code:
          $ref: "#/components/schemas/Code"
        committed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    EntrySummary:
      type: object
      required: [path, type]
      properties:
        path:
          type: string
        type:
          type: string
          enum: [file, directory]
        size:
          type: integer
          minimum: 0

    TransferMetadata:
      type: object
      required: [code, committed_at, expires_at, file_count, total_bytes, entries]
      properties:
        code:
          $ref: "#/components/schemas/Code"
        note:
          type: string
        committed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        file_count:
          type: integer
        total_bytes:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntrySummary"

    ClaimSegment:
      type: object
      required: [id, kind, length, digest, path]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [raw, tar_zstd]
        length:
          type: integer
        digest:
          type: string
        path:
          type: string

    ClaimResponse:
      type: object
      required: [claim_id, token, lease_until, manifest, segments]
      properties:
        claim_id:
          type: string
        token:
          type: string
        lease_until:
          type: string
          format: date-time
        manifest:
          type: object
          additionalProperties: true
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSegment"

    LocalClaim:
      type: object
      required: [ok, code, path, read_only, lease_until]
      properties:
        ok:
          type: boolean
          const: true
        code:
          $ref: "#/components/schemas/Code"
        path:
          type: string
        read_only:
          type: boolean
          const: true
        lease_until:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
